[project]
name = "private-ai-hub"
version = "0.5.0"
description = "Private AI Hub: a browser-based local AI gateway for private LLM inference and file collaboration."
readme = "README.md"
requires-python = ">=3.13.12"
dependencies = [
    "charset-normalizer>=3.5.1",
    "fastapi>=0.138.0",
    "jinja2>=3.1.6",
    "odfpy>=1.4.1",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
    "uvicorn>=0.49.0",
    "xlrd>=2.0.2",
]
