<!DOCTYPE html>
<html lang="{{current_language}}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private AI Hub</title>
    <!-- <link rel="stylesheet" href="/static/style.css"> -->
    <link rel="stylesheet" href="/static/style.css?v={{version}}">
    <!-- Per no tenir tots els estils en un arxiu -->
    <link rel="stylesheet" href="/static/files.css?v={{version}}">

    <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/icons/favicon.ico">
    <link rel="icon" href="/static/icons/favicon.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="/static/vendor/katex.min.css">

</head>

<body>
    <div id="contenedor-principal">
        <header id="bloque-superior">
            <div id="el-flexo">
                <div>
                    <img alt="Private AI Hub logo" src="/static/icons/favicon.svg" width="32px">
                    <h1>Private AI Hub</h1><span id="author" idio="byAuthor">{{byAuthor}}</span>
                </div>
                <!-- <div id="idibox">
                    <img id="idi" src="/static/icons/idioma_MVM.svg" alt="Select Language">
                    <select id="idioma">
                        <option value="en" {% if current_language=='en' %}selected{% endif %}>English</option>
                        <option value="es" {% if current_language=='es' %}selected{% endif %}>Español</option>
                        <option value="ca" {% if current_language=='ca' %}selected{% endif %}>Català</option>
                    </select>
                </div> -->
                <div id="blocbox">
                    <div style="position: relative;">
                    <!-- <div class = "desplegable-header disabled" idio-tool="newChat" data-tooltip="{{newChat}}"> -->
                    <!-- <div class="btnSup disabled" id="nouXat">
                        <button type="button" idio-tool="newChat" data-tooltip="{{newChat}}"> -->
                    <div class="btnSup disabled" id="nouXat" idio-tool="newChat" data-tooltip="{{newChat}}">
                        <button type="button" id="btnNouXat">
                            <img class="descarregables" src="/static/icons/nouX_MVM.svg" alt="{{newChat}}">
                        </button>
                    </div>
                    </div>
                    <div class="desplegable disabled" id="descarregar">
                        <!-- <button class="desplegable-toggle" type="button">
                            📥 Descargar
                        </button> -->
                        <!-- <div class = "desplegable-header disabled"> -->
                        <div class = "desplegable-header" idio-tool="descConvers" data-tooltip="{{descConvers}}">
                            <img class="descarregables" src="/static/icons/descarrega_MVM.svg" alt="{{descConvers}}">
                            <!-- <img class="descarregables" src="/static/descarrega_MVM.svg" alt="Descargar"> -->
                            <!-- <span>📥 Descargar</span> -->
                        </div>

                        <div class="desplegable-menu">
                            <button type="button" data-format="txt" data-tooltip="{{txt}}">
                                <!-- <img class="descarregables" src="/static/des_TXT02_MVM.svg" alt="Descargar en formato texto"> -->
                                <img class="descarregables" src="/static/icons/des_TXT02_MVM.svg" alt="{{txt}}">
                            </button>
                            <button type="button" data-format="md" data-tooltip="{{md}}">
                                <!-- <img class="descarregables" src="/static/des_MD02_MVM.svg" alt="Descargar en formato markdown"> -->
                                <img class="descarregables" src="/static/icons/des_MD02_MVM.svg" alt="{{md}}">
                            </button>
                            <button type="button" data-format="pdf" data-tooltip="{{pdf}}">
                                <!-- <img class="descarregables" src="/static/des_PDF02_MVM.svg" alt="Descargar en formato PDF"> -->
                                <img class="descarregables" src="/static/icons/des_PDF_MVM.svg" alt="{{pdf}}">
                            </button>
                        </div>
                    </div>
                    <div id="idibox">
                        <img id="idi" src="/static/icons/idioma_MVM.svg" alt="Select Language">
                        <select id="idioma">
                            <option value="en" {% if current_language=='en' %}selected{% endif %}>English</option>
                            <option value="es" {% if current_language=='es' %}selected{% endif %}>Español</option>
                            <option value="ca" {% if current_language=='ca' %}selected{% endif %}>Català</option>
                        </select>
                    </div>
                </div> 
            </div>
            <hr>
        </header>
        <main id="bloque-central">
            <div id="mensaje-inicial" style="font-style: italic;">
                ...waiting a message / esperando un mensaje / esperant un missatge
            </div>
        </main>
        <footer id="bloque-inferior">
            <!-- Formulario de envío DE MOMENTO POR JAVASCRIPT -->
            <form id="bloque-formulario">
                <select id="perfil">
                    <option value="{{perfils[0][0]}}">{{perfils[0][1]}}</option>
                    {% for perfil in perfils[1:] %}
                    <option value="{{perfil[0]}}">{{perfil[1]}}</option>
                    {% endfor %}
                </select>
                <div style="display: flex;">
                    <!-- de moment mantenim input tipus text -->
                    <textarea id="el-mensaje" name="mensaje" placeholder="{{msgPlaceholder}}"
                        idio-place="msgPlaceholder" rows="1"></textarea>
                    <div id="botons">
                        <!-- botó deshabilitat pq no tindrà text per enviar d'entrada -->
                        <button type="submit" id="enviar" disabled="true" idio="sendButton">{{sendButton}}</button>
                        <div id="afegir_arch">&#9547</div>
                    </div>
                </div>
                <div id="arxius"></div>
            </form>
            <!-- FIN DEL FORMULARIO -->

        </footer>

    </div>
    <div id="content">

    </div>
    <!-- IMPORTANT: ESTÀ DESHABILITAT PERQUÈ CARREGUI I NO FACI CACHÉ
<script src="/static/app.js"></script>
-->
    <script>
        const alertes = {
            mida: "{{mida}}",
            inclos: "{{inclos}}"
        };
        let traduccions ={
            answer: "{{answer}}",
            descConvers: "{{descConvers}}",
            txt: "{{txt}}",
            md: "{{md}}",
            pdf: "{{pdf}}"
        };
    </script>
    <!-- llibreries externes -->
    <script src="/static/vendor/marked.umd.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <script src="/static/vendor/katex.min.js"></script>
    <script src="/static/vendor/auto-render.min.js"></script>

    <!-- codi generat per mi -->
    <!-- <script src="/static/app.js?v={{version}}"></script> -->
    <script type="module" src="/static/app.js?v={{version}}"></script>
    <script src="/static/files.js?v={{version}}"></script>
</body>

</html>
